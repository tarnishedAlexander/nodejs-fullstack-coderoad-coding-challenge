name: Deploy Fullstack App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build Frontend (Vite)
        run: |
          cd client
          npm ci
          npm run build

      - name: Install Backend
        run: |
          cd server
          npm ci

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: |
            client/dist/**
            server/**
            .env
          target: ~/app/
          recursive: true

      - name: Restart PM2 + Copy static files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/app
            rm -rf server/node_modules client/dist
            mv ../app/server/* server/ 2>/dev/null || true
            mv ../app/client/dist ./client/ 2>/dev/null || true
            cp .env server/ 2>/dev/null || true
            cd server
            npm ci --production
            pm2 restart app || pm2 start src/server.ts --name app --interpreter tsx
            sudo rm -rf /var/www/html/*
            sudo cp -r ../client/dist/* /var/www/html/
